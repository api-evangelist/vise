name: Vise
description: 'Vise is an SEC-registered investment adviser that provides an AI-powered wealth
  management platform for financial advisors, RIAs, enterprise wealth firms, and asset managers.
  The platform helps advisors build personalized, tax-aware portfolios and supports direct
  indexing, fixed income management, long/short strategies, tax-loss harvesting, portfolio
  rebalancing, and client reporting, managing over $100B in platform assets across 135K+
  accounts. Vise publishes no public API, developer portal, or SDK; this profile captures
  its public company, legal, and domain-security surface for the API Evangelist network.'
